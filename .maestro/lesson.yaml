# Une leçon déjà terminée par le compte de test, rejouée jusqu'au bout :
# l'écran de fin doit afficher « Leçon terminée ! » et les chiffres du serveur.
appId: academy.karatou.app
name: lesson
env:
  LESSON: data-analysis/d1
---
- launchApp
- runFlow: subflows/close-dev-menu.yaml
- runFlow: subflows/sign-in.yaml
- openLink: karatou://lesson/${LESSON}
- runFlow: subflows/play-lesson.yaml
- assertVisible:
    id: "lesson-complete-passed"
- extendedWaitUntil:
    visible: ".*Total officiel.*|.*Official total.*|.*Jimillar hukuma.*"
    timeout: 20000
- takeScreenshot: e2e-artifacts/lesson-complete
- tapOn:
    id: "lesson-complete-continue"
