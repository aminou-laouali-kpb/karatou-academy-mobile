# Build de dev seulement : au premier lancement après un redémarrage de Metro,
# le menu de développement Expo s'ouvre par-dessus l'app et masque tout.
# On lui laisse quelques secondes pour apparaître, puis on le ferme.
appId: academy.karatou.app
---
- extendedWaitUntil:
    visible: "Toggle element inspector"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Toggle element inspector"
    commands:
      # Première ouverture : un écran d'accueil du menu avec « Continue ».
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          id: "xmark"
          optional: true
